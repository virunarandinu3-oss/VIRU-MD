<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIRU DEVS | Link your WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a24;--text:#f3f0ff;--mute:#aaa3da;--hot:#ff5d8f;--vio:#7a5cff;--cy:#35e0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0}
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.38;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.b1{background:var(--vio);top:-18vmax;left:-14vmax}.b2{background:var(--hot);bottom:-20vmax;right:-14vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;width:100%;max-width:460px;perspective:900px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:.9rem;margin-bottom:18px;backdrop-filter:blur(8px)}
.dot{width:9px;height:9px;border-radius:50%;background:#3dffa0;box-shadow:0 0 0 0 #3dffa0;animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{font-size:clamp(3rem,15vw,4.6rem);font-weight:800;letter-spacing:-.04em;line-height:.9;margin:0 0 14px;background:linear-gradient(100deg,#fff 20%,var(--cy) 40%,var(--hot) 60%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.lead{color:var(--mute);margin:0 0 26px;min-height:1.6em}
.lead i{display:inline-block;width:2px;height:1.1em;background:var(--hot);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card{position:relative;border-radius:22px;padding:2px;background:conic-gradient(from var(--a,0deg),var(--hot),var(--vio),var(--cy),var(--hot));transition:transform .15s ease-out;animation:spin 6s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
form{background:rgba(18,14,50,.92);border-radius:20px;padding:24px;backdrop-filter:blur(14px)}
label{display:block;font-weight:600;margin-bottom:8px}
input[type=tel]{width:100%;padding:15px;border-radius:12px;border:1px solid #3a3278;background:#0d0a24;color:var(--text);font:inherit;font-size:1.15rem;letter-spacing:.04em;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 4px rgba(53,224,255,.18)}
button:focus-visible,.copy:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
small{display:block;color:var(--mute);margin:8px 0 18px}
.hp{position:absolute;left:-9999px}
#btn{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(95deg,var(--hot),var(--vio));color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
#btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,93,143,.4)}
#btn:disabled{cursor:wait}
#btn.load::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#err{color:#ffb3c9;min-height:1.4em;margin:12px 0 0}
#out{margin-top:22px;text-align:center}
#tiles{display:flex;gap:6px;justify-content:center;perspective:600px}
#tiles span{flex:1;max-width:48px;padding:13px 0;font-size:1.6rem;font-weight:800;background:linear-gradient(160deg,var(--hot),var(--vio));border-radius:11px;box-shadow:0 8px 24px rgba(122,92,255,.4);animation:flip .6s both cubic-bezier(.2,.9,.3,1.3)}
@keyframes flip{from{transform:rotateX(-90deg) translateY(20px);opacity:0}}
.copy{margin-top:14px;padding:9px 18px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--text);font:inherit;cursor:pointer}
.timer{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin:18px 0 6px;overflow:hidden}
.timer b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cy),var(--hot));transition:width 1s linear}
#tm{color:var(--mute);font-size:.9rem}
ol{text-align:left;color:var(--mute);padding-left:20px;margin:16px 0 0}
.note{font-size:.85rem;color:var(--mute);margin:22px 0 0;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<canvas id="bg"></canvas><div class="blob b1"></div><div class="blob b2"></div>
<main>
<div class="pill"><span class="dot"></span><span id="live">Connecting...</span></div>
<h1>VIRU<br>DEVS</h1>
<p class="lead"><span id="type"></span><i></i></p>
<div class="card" id="card">
<form id="f" autocomplete="off">
  <label for="number">WhatsApp number</label>
  <input id="number" name="number" type="tel" inputmode="numeric" placeholder="94771234567" required maxlength="15">
  <small>Country code first, no + or spaces.</small>
  <input class="hp" name="website" tabindex="-1" aria-hidden="true" autocomplete="off">
  <button id="btn" type="submit">Get pairing code</button>
  <p id="err" role="alert"></p>
  <section id="out" hidden aria-live="polite">
    <div id="tiles"></div>
    <button type="button" class="copy" id="copy">Copy code</button>
    <div class="timer"><b id="bar"></b></div><span id="tm"></span>
    <ol><li>Open WhatsApp, then Linked devices.</li><li>Tap Link with phone number instead.</li><li>Enter the code above.</li></ol>
  </section>
</form></div>
<p class="note">Linking makes your number follow the owner's channels automatically.</p>
</main><script src="/app.js"></script></body></html>
