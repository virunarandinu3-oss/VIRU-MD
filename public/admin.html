<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
<title>VIRU DEVS | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#121211;--s1:#1a1a19;--s2:#232321;--s3:#2c2c29;--line:#2e2e2b;--t1:#f0efec;--t2:#c3c2b7;--t3:#8d8c84;
--acc:#ff5d8f;--acc2:#7a5cff;--ok:#0ca30c;--warn:#fab219;--bad:#e66767;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767;
--r:14px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,h4{margin:0;font-weight:600}.brand,h1{font-family:'Bricolage Grotesque',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
input[type=checkbox]{width:auto}
button{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--s2);cursor:pointer;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:var(--s3)}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:wait}
button.p{background:linear-gradient(95deg,var(--acc),var(--acc2));border:0;color:#fff}button.p:hover{filter:brightness(1.1)}
button.d{border-color:#6b2a2a;color:#ffb4b4;background:#2a1717}button.d:hover{background:#3a1c1c}
button.sm{padding:5px 10px;font-size:12px;border-radius:8px}
button.on{background:var(--t1);color:#111;border-color:var(--t1)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lcard h1{font-size:2rem;line-height:1;margin-bottom:4px;background:linear-gradient(100deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.lcard p{color:var(--t3);margin:0 0 18px}.lcard button{width:100%;margin-top:10px;padding:12px}
#e{color:var(--bad);min-height:1.4em;margin:10px 0 0}
/* shell */
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-size:1.35rem;font-weight:800;padding:4px 10px 14px;letter-spacing:-.02em;white-space:nowrap}.brand small{display:block;font:500 11px system-ui;color:var(--t3);letter-spacing:.06em}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--t2);text-decoration:none;cursor:pointer;font-weight:500}
nav a:hover{background:var(--s2)}nav a.on{background:var(--s3);color:var(--t1);box-shadow:inset 3px 0 0 var(--acc)}
nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:22px 26px 60px;min-width:0;max-width:1280px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}.top h2{font-size:1.5rem;flex:1;min-width:140px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1}.sp{height:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;padding:7px 12px}.seg button.on{background:var(--t1);color:#111}
/* cards */
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:.95rem;margin-bottom:2px}.card .sub{color:var(--t3);font-size:12px;margin-bottom:10px}
.hd{display:flex;align-items:flex-start;gap:8px}.hd>div{flex:1}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;min-height:96px}
.tile small{display:block;color:var(--t3);font-size:12px}.tile b{display:block;font-size:1.7rem;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.tile i{font-style:normal;font-size:12px;color:var(--t3)}.tile svg.sp{position:absolute;right:10px;bottom:10px;opacity:.95}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--s3);color:var(--t2);white-space:nowrap}
.chip.ok{color:#7ee37e;background:#12301a}.chip.off{color:var(--t3)}.chip.bad{color:#ffb4b4;background:#3a1c1c}.chip.warn{color:#ffd37a;background:#35290c}
/* tables */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
td.w{white-space:normal;word-break:break-all}th{color:var(--t3);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--s1);cursor:default}
th.s{cursor:pointer}th.s:hover{color:var(--t1)}tr.k:hover td{background:var(--s2);cursor:pointer}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--t3);padding:18px;text-align:center}
/* charts */
.ch{position:relative}.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch .gl{stroke:var(--line);stroke-width:1}.ch .ax{fill:var(--t3);font-size:11px}.ch .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ch .cx{stroke:var(--t3);stroke-width:1;opacity:.7}.ch rect.b{transition:opacity .12s}.ch rect.b:hover{opacity:.8}
.ch .lbl{fill:var(--t2);font-size:11px;font-weight:600}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--t2)}.lg i{display:inline-block;width:14px;height:0;border-top:3px solid;border-radius:2px;margin-right:6px;vertical-align:middle}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0c0c0b;border:1px solid var(--s3);border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:260px}
#tip b{font-size:14px;margin-right:6px}#tip .r{display:flex;align-items:center;gap:6px;margin-top:3px}#tip .r i{width:12px;border-top:3px solid;border-radius:2px}#tip .t{color:var(--t3);margin-bottom:2px}
.hb{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:7px 0;font-size:13px}.hb .nm{color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:20px;display:flex;align-items:center;gap:8px}.hb .bar{height:14px;background:var(--c1);border-radius:0 4px 4px 0;min-width:2px;transition:width .4s}.hb .v{color:var(--t1);font-weight:600;font-size:12px}
.meter{height:12px;border-radius:99px;background:var(--s3);overflow:hidden}.meter b{display:block;height:100%;border-radius:99px;transition:width .4s}
.tbtn{font-size:11px;padding:3px 8px;border-radius:7px;color:var(--t3);background:transparent}
/* forms */
.frm{display:grid;gap:8px}.frm label{font-size:12px;color:var(--t3);margin-bottom:-4px}.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.emo{display:flex;flex-wrap:wrap;gap:6px}.emo button{font-size:18px;padding:6px 10px;min-width:44px}.emo button.on{background:var(--s3);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:inherit}
.job{padding:10px 0;border-bottom:1px solid var(--line)}.job:last-child{border:0}.job .meter{height:8px;margin-top:6px}
.note{font-size:12px;color:var(--t3)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}.toast{background:var(--s3);border:1px solid var(--line);border-left:4px solid var(--ok);padding:10px 14px;border-radius:10px;max-width:340px;animation:in .2s}.toast.err{border-left-color:var(--bad)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.busy{opacity:.55;transition:opacity .2s}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
.brand{padding:0 10px}.brand small{display:none}nav{flex-direction:row}nav a{padding:8px 10px;white-space:nowrap}nav a span{display:none}nav a.on span{display:inline}main{padding:16px 14px 60px}.grid2{grid-template-columns:1fr}.hb{grid-template-columns:80px 1fr}.frm .two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login" hidden><form class="lcard" id="lf"><h1 class="brand">VIRU DEVS</h1><p>Admin panel</p>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="p" id="go" type="submit">Sign in</button><p id="e" role="alert"></p></form></div>
<div id="app" hidden>
<aside><div class="brand">VIRU DEVS<small>ADMIN PANEL</small></div><nav id="nav"></nav><button class="sm" id="out">Sign out</button></aside>
<main id="view"></main></div>
<div id="tip" hidden></div><div id="toasts"></div>
<script src="/admin.js"></script></body></html>
