<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
<title>Admin</title>
<style>
:root{--bg:#0d0a24;--p:#1d1844;--l:#3a3278;--t:#f3f0ff;--m:#aaa3da;--h:#ff5d8f;--c:#35e0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif}
[hidden]{display:none!important}
#login{max-width:340px;margin:18vh auto;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:26px}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--c)}
button{padding:9px 14px;border:0;border-radius:10px;background:var(--h);color:#2a0615;font:inherit;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
button.s{background:var(--p);color:var(--t);border:1px solid var(--l)}button.on{background:var(--c);color:#04222b;border-color:var(--c)}button.bad{background:#5a1030;color:#ffd0df;border-color:#8a1d4a}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--l);background:var(--p)}
#nav{flex:1;display:flex;flex-wrap:wrap}main{padding:16px;max-width:1100px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.c{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px}.c small{display:block;color:var(--m)}.c b{font-size:1.5rem}
.tw{overflow-x:auto;margin:8px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--l);font-size:.9rem;word-break:break-all}th{color:var(--m)}
section{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;margin:14px 0}h3{margin:6px 0}#e{color:#ffb3c9}
</style></head><body>
<div id="login"><h2>VIRU DEVS Admin</h2><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Sign in</button><p id="e" role="alert"></p></div>
<div id="app" hidden><header><b>VIRU DEVS</b><div id="nav"></div><button class="s" id="out">Sign out</button></header><main id="view"></main></div>
<script src="/admin.js"></script></body></html>
